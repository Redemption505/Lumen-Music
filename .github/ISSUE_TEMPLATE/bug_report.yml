name: 问题反馈
description: 报告启动、播放、歌词、曲库或界面问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进 Lumen。请先搜索已有 Issue，并记录“设置 → 版本与反馈”的完整构建号。
        无法打开应用时可填写“无法确认”，同时注明收到的包名。请勿上传曲库备份、Cookie、密钥或完整私人日志。
  - type: input
    id: build
    attributes:
      label: 版本与构建号
      placeholder: "例如：v0.2.2 / lumen-0.2.2-20261010.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与运行方式
      placeholder: "例如：Windows 11 x64，安装版，同版本覆盖升级；如涉及界面请附缩放比例"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 安装、升级或卸载
        - 启动、响应或退出
        - 本地音乐与导入
        - 在线搜索或播放
        - 歌词、封面或合集片段
        - 收藏、歌单或数据恢复
        - 界面、迷你播放器或桌宠
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动应用或打开页面开始，说明操作顺序、出现频率，以及是否每次都能复现。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际结果
      placeholder: |
        预期：
        实际：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息（可选）
      description: 可提供去除私人信息的截图、固定错误码或必要诊断摘录。涉及音源时注明本地/在线、格式或可公开访问的链接；不要上传音频或带凭据的 URL。
