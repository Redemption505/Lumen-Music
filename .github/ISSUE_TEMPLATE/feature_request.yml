name: 功能与体验建议
description: 描述希望改善的使用场景
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议，并参考 README 的当前平台与内测范围。
        从实际使用中遇到的问题出发，方便讨论优先级与验收方式。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么时候遇到什么不便？目前怎样完成这件事？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 描述完成后的操作或结果；没有具体方案也可以说明希望达到的效果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方法或参考（可选）
      description: 可附公开链接或去除私人信息的示意图，并说明参考的具体细节。
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样算改善了（可选）
      description: 用一个具体操作或前后对比说明期望；涉及平台时注明目标系统。
