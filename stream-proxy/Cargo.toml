[package]
name = "lumen-stream-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
